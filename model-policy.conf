# Model policy for the Tier 1 / Tier 2 slots (orchestrator + lead-*).
#
# Plain shell, sourced by bin/orch-model-guard, bin/cc-orch and build-roster.sh — no JSON parser
# needed anywhere in the hot path, which is why this is not a .json file like guardrails.json.
#
# Tier 3 (dev-*, verifier) is not part of the switch: it already runs on Opus 5.

# What the tier runs on normally, and what it falls back to when PRIMARY's weekly quota is gone.
PRIMARY_MODEL="fable[1m]"
FALLBACK_MODEL="opus[1m]"

# Weekly-utilization thresholds, in percent, as reported by `claude -p /usage` for the
# "Current week (Fable)" bucket (the API calls it seven_day_overage_included).
#
# Two thresholds, not one, on purpose: a single threshold would flip back and forth while the
# number hovers on the boundary. Between the two the guard keeps whatever is already active.
#   >= SWITCH_AT_PCT   -> fall back to FALLBACK_MODEL
#   <= RESTORE_AT_PCT  -> return to PRIMARY_MODEL (this is what a week rollover looks like)
#
# 98, not 100, on purpose: 100 IS the wall, and the guard only looks every POLL_MINUTES, so
# switching there buys a few minutes of rejected calls. The last 2% is cheap insurance.
SWITCH_AT_PCT=98
RESTORE_AT_PCT=90

# Substring identifying the primary model's own weekly bucket in the /usage panel.
# Matched case-insensitively against the label inside "Current week (...)".
USAGE_LABEL="Fable"

# How often the systemd user timer re-checks.
POLL_MINUTES=5

# --- Lane pressure -> dispatch hint (`orch-model-guard lanes`, read by leads before Phase C) ---
# The weekly guard above protects Tier 1/2 (Fable) only. What actually runs out first under
# heavy orchestration is the 5h SESSION bucket, which every Claude call in the tree drains
# (leads, devs, verifier alike) — measured: session at 79% while the weeks sat at 29%/50%.
# `lanes` turns that pressure into a one-line dispatch hint so leads shift Tier 3 work onto
# the Codex pool, which is a separate quota this harness historically left almost untouched.
#   session >= LANES_CODEX_FIRST_SESSION_PCT  -> dispatch=codex-first
#   week(all models) >= LANES_CODEX_FIRST_WEEK_PCT -> dispatch=codex-first
#   otherwise                                  -> dispatch=balanced (codex is still the
#                                                 default implement lane; devs are the
#                                                 parallel/1M/steering exception)
LANES_CODEX_FIRST_SESSION_PCT=60
LANES_CODEX_FIRST_WEEK_PCT=75

# --- Codex lanes (sourced by bin/codex-run) ----------------------------------------------
# Second provider: OpenAI Codex CLI, ChatGPT login, its own max-20x quota pool — so spreading
# Tier 3 load between dev-* (Opus) and these lanes extends total weekly throughput, and the
# Tier 4 review gate gets a model family that does not share Claude's blind spots.
#
# Slugs and effort ceilings, measured from ~/.codex/models_cache.json on codex-cli 0.144.4:
#   gpt-5.6-sol    "latest frontier agentic coding model"   efforts low..ultra, DEFAULT LOW
#   gpt-5.6-terra  "balanced"                               efforts low..ultra
#   gpt-5.6-luna   "fast and affordable"                    efforts low..max
# Sol defaulting to LOW is the reason codex-run always passes an effort explicitly.

CODEX_IMPL_MODEL="gpt-5.6-sol"     # Tier 3 lane: implementation, debugging, 2nd attempts
CODEX_IMPL_EFFORT="xhigh"          # max costs real latency; xhigh is the spec-bound sweet spot
CODEX_ESCALATE_EFFORT="max"        # --escalate: retry after a failed round / rescue work

CODEX_REVIEW_MODEL="gpt-5.6-sol"   # Tier 4 gate: adversarial cross-family diff review
CODEX_REVIEW_EFFORT="xhigh"

CODEX_FAST_MODEL="gpt-5.6-luna"    # --fast: small/low-risk diffs, cheap plan checks
CODEX_FAST_EFFORT="high"

CODEX_MECH_MODEL="gpt-5.6-luna"    # --mech: bulk mechanical edits (renames, lint, boilerplate)
CODEX_MECH_EFFORT="medium"

CODEX_IMPL_TIMEOUT_SECS=5400       # agentic implement runs (priority tier is 1.5x, still long)
CODEX_REVIEW_TIMEOUT_SECS=2700     # read-only review runs

# "ultra" (max + automatic task delegation inside Codex) is deliberately no lane's default:
# decomposition belongs to Tier 2, and ultra's sub-delegation makes spend unpredictable.
# A lead may pass --effort ultra only when the user explicitly asks for it.
