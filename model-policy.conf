# Model and quota policy for cc-orchestra.
#
# Plain shell, sourced by the launcher, roster generator, model guard, and codex wrapper. Keep
# this file declarative: it is the one place where a profile maps to a model and an effort.

# --- Claude control profiles -------------------------------------------------------------
# Sonnet is the normal orchestrator model. Fable is a deep-reasoning reserve (critical-xhigh only).
# Opus 5.5 carries normal and critical leads. If the Fable weekly bucket is exhausted, every
# control profile is rewritten to Opus until that bucket resets.
PRIMARY_MODEL="sonnet[1m]"
FALLBACK_MODEL="opus[1m]"

ORCH_EFFORT="high"

LEAD_LIGHT_MODEL="sonnet[1m]"
LEAD_LIGHT_EFFORT="medium"
# RISK: trivial reuses the light profile; it changes only the Tier 4 gate policy (bin/orch-summary-check).
LEAD_NORMAL_MODEL="opus[1m]"
LEAD_NORMAL_EFFORT="high"
# 2026-09-23: Critical leads run Opus 5.5 at xhigh; it matches or beats Fable 5.1 on Anthropic's
# published benchmarks at 40% of Fable's per-token price on uncached input and output; Fable is the
# harness's binding weekly bucket and stays the deep (critical-xhigh) reserve.
LEAD_CRITICAL_MODEL="opus[1m]"
LEAD_CRITICAL_EFFORT="xhigh"
LEAD_DEEP_MODEL="fable[1m]"
LEAD_DEEP_EFFORT="xhigh"

DEV_MODEL="sonnet[1m]"
DEV_EFFORT="high"
DEV_FRESH_MODEL="opus[1m]"
DEV_FRESH_EFFORT="high"

VERIFIER_FALLBACK_MODEL="sonnet[1m]"
VERIFIER_FALLBACK_EFFORT="high"
# The critical verifier is a generated agent: build-roster.sh renders
# templates/verifier.md.tpl into ~/.claude/agents/verifier.md with these values. It is
# intentionally NOT rewritten by orch-model-guard's Fable fallback — the critical gate's
# independent opinion must not silently follow whatever model the quota guard pinned.
VERIFIER_CRITICAL_MODEL="opus[1m]"
VERIFIER_CRITICAL_EFFORT="max"

# --- Fable quota switch ------------------------------------------------------------------
# Fable is used only by deep (critical-xhigh) leads, but its exhaustion is a global fallback state:
# orchestrator plus every lead profile moves to Opus. Hysteresis prevents boundary flapping.
FABLE_USAGE_LABEL="Fable"
SWITCH_AT_PCT=98
RESTORE_AT_PCT=90
POLL_MINUTES=5

# --- Provider pressure -> dispatch (`orch-model-guard lanes`) ----------------------------
# Codex is first whenever its weekly pool has room. There is no "balanced" Claude spill: a
# third implementation unit waits rather than consuming a dev slot merely for wall-clock speed.
# Only codex-sparing permits Claude implementation, and explicit fallback/context/steering/GPU/
# fresh-eyes exceptions in the lead prompt remain available.
LANES_CODEX_SPARE_PCT=90
CODEX_USAGE_STALE_HOURS=24

# --- Codex lanes -------------------------------------------------------------------------
# Plain (non-routed) defaults and healthy-tier Astra fallbacks are GPT-6.1 Sol
# (gpt-6.1-sol, user decision 2026-10-01, replacing the previous Sol default).
# Sol also fills the former Terra slots (intake, verify) because there is no GPT-6 Terra;
# Luna remains gpt-6-luna for --fast/--mech. The pressure table uses GPT-6 Astra/GPT-6.1 Sol.
# Efforts stay unchanged: implementation xhigh, analysis/gates high, critical xhigh, rescue max.
CODEX_IMPL_MODEL="gpt-6.1-sol"
CODEX_IMPL_EFFORT="xhigh"
CODEX_ESCALATE_EFFORT="max"

CODEX_INVESTIGATE_MODEL="gpt-6.1-sol"
CODEX_INVESTIGATE_EFFORT="high"

CODEX_INTAKE_MODEL="gpt-6.1-sol"
CODEX_INTAKE_EFFORT="high"

CODEX_REVIEW_MODEL="gpt-6.1-sol"
CODEX_REVIEW_EFFORT="high"
CODEX_CRITICAL_EFFORT="xhigh"

CODEX_VERIFY_MODEL="gpt-6.1-sol"
CODEX_VERIFY_EFFORT="high"

CODEX_FAST_MODEL="gpt-6-luna"
CODEX_FAST_EFFORT="high"

# Official Codex Fast mode is an opt-in service tier. codex-run --fast-mode keeps the resolved
# Astra/Sol/Terra model and applies this tier only to that invocation; it is distinct from --fast above.
CODEX_FAST_MODE_SERVICE_TIER="fast"

CODEX_MECH_MODEL="gpt-6-luna"
CODEX_MECH_EFFORT="medium"

CODEX_IMPL_TIMEOUT_SECS=5400
CODEX_REVIEW_TIMEOUT_SECS=2700

# Active-context artifact budgets. The checker warns by default and becomes a hard gate with
# `orch-summary-check --strict`. Detail beyond these limits belongs in evidence/ or rounds/.
BRIEF_MAX_BYTES=12288
PLAN_MAX_BYTES=40960
SUMMARY_MAX_BYTES=20480

# Normal and critical gate-round caps. A higher round requires an explicit
# `EXTRA GATE ROUND: approved` line in brief.md.
NORMAL_GATE_ROUNDS=2
CRITICAL_GATE_ROUNDS=3
