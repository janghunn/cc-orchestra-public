# Local archive policy. Parsed as data, never sourced.
VAULT_DIR=~/orchestra-vault
RAW_DIR=~/.claude/orchestra-archive/raw
ALLOWLIST_FILE=~/.claude/orchestra-archive/allowlist.txt
STATE_DIRS=~/.claude/orchestra-state:~/.local/state/cc-orchestra-codex
CLAUDE_PROJECTS_DIR=~/.claude/projects
CODEX_HOME_DIR=~/.codex
EXTRA_BASES=~
INCLUDE_CLAUDE_TRANSCRIPTS=1
INCLUDE_CODEX_ROLLOUTS=1
INCLUDE_PAYLOAD=1
CHECKPOINT_EXTENSIONS=.pt .pth .ckpt .safetensors .onnx .engine .trt .h5 .npz .npy
PAYLOAD_FILE_MAX_BYTES=16777216
PAYLOAD_TASK_MAX_BYTES=268435456
VAULT_TEXT_EXTENSIONS=.md .txt .csv .tsv .json .yaml .yml
VAULT_TEXT_MAX_BYTES=1048576
TEXT_EXTENSIONS=.md .txt .json .jsonl .log .csv .tsv .yaml .yml .py .sh .conf .toml .diff .patch .html .xml .cfg .ini
APPEND_EXTENSIONS=.jsonl .log
SIZE_REPORT_BYTES=104857600
NESTED_ROOT_MAX_DEPTH=4
GZIP_LEVEL=6
COMMIT=1
IMAGE_EXTENSIONS=.png
THUMB_ENCODER=auto
THUMB_MAX_EDGE=512
THUMB_QUALITY=70
THUMB_MAX_BYTES=65536
THUMB_MAX_PIXELS=100000000
THUMB_EMBED_MAX=8
THUMB_MAX_PER_TASK=48
