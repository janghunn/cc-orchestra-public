# Read ONLY by bin/orch-usage-report --cost; never sourced; never affects routing/budget.
# Source: https://developers.openai.com/api/docs/pricing — Standard column,
# USD per 1M tokens, checked by Tier 1 on 2026-10-02.
# Fast mode costs 2x-4x Standard; exact per-model multipliers were not captured.
# Batch's 50% discount is not used here.
# gpt-6.1-sol >272K-input surcharge: 2x input/cache, 1.5x output, per request;
# aggregated usage cannot establish request prompt sizes, so it is not applied.
# reasoning_output_tokens are included in output_tokens.
# cache_write_input_tokens are part of input and are not priced separately.
PRICING_EFFECTIVE_DATE=2026-10-02
PRICING_SOURCE_URL=https://developers.openai.com/api/docs/pricing
PRICING_COUNTERFACTUAL_MODEL=gpt-6-astra
# RATE_<model-slug>=<input>/<cached_input>/<output>   USD per 1M tokens, Standard tier
RATE_gpt-6-astra=10.00/1.00/50.00
RATE_gpt-6.1-sol=2.00/0.10/10.00
RATE_gpt-6-sol=2.00/0.20/10.00
RATE_gpt-6-luna=0.10/0.01/0.50
RATE_gpt-5.6-terra=2.00/0.20/12.00
# FAST_MULTIPLIER_<model-slug>=<positive number>; unset = unknown → Standard-rate estimate.
# FAST_MULTIPLIER_gpt-6-astra=
