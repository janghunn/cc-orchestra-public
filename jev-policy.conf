# Runtime Jev advisory policy; read by bin/orch-jev on each invocation.
# This file is outside orch-policy-rev; edits apply to the next invocation.
# The key is never in this file: use TYPESAFE_API_KEY or <state>/jev.key (mode 600).

# Set to 0 to disable the advisory client.
JEV_ENABLED=1
# A pinned jev-X.Y.Z is required; a floating alias refuses to run.
JEV_MODEL="jev-1.13.0"
# Only https://api.typesafe.ai/... or loopback endpoints are accepted.
JEV_ENDPOINT="https://api.typesafe.ai/v1/systemone"
# Per-attempt timeout, in seconds (greater than 0, at most 15).
JEV_TIMEOUT_SECONDS=6
# Maximum serialized state size in UTF-8 bytes.
JEV_MAX_STATE_BYTES=24000
# Maximum acceptance items and matching questions sent.
JEV_LINT_MAX_ITEMS=20
# Report acceptance items below this checkability probability.
JEV_LINT_THRESHOLD=0.5
# Minimum confidence for a suggestion to raise the declared tier.
JEV_RISK_MIN_CONFIDENCE=0.6
# Maximum UTF-8 bytes per scan chunk.
JEV_SCAN_CHUNK_BYTES=4000
# Maximum chunks and matching questions across all scan sources.
JEV_SCAN_MAX_CHUNKS=24
# Report scan chunks at or above this probability.
JEV_SCAN_THRESHOLD=0.7
# Set to 0 to disable the metadata-only journal.
JEV_JOURNAL=1

# --- Codex-routing shadow mode (opt-in, log only; changes no dispatch) ---
# Set to 1 to let codex-run-runtime start a detached orch-jev shadow worker on first-run
# implement calls. Only <task-dir>/brief.md leaves the machine, after the egress guard.
# Off since 2026-10-06: Stage 1 returned `do not adopt` (eval/jev-shadow-stage1/report-2026-10-06.md); turning it on again needs a new decision.
JEV_SHADOW_ENABLED=0
# Difficulty -> Codex model@effort suggestion. Jev classifies difficulty only; this mapping
# is ours and can be changed at any time; shadow-report re-applies it to the raw answers.
JEV_SHADOW_MAP_MECHANICAL="gpt-6-luna@medium"
JEV_SHADOW_MAP_ROUTINE="gpt-6-astra@high"
JEV_SHADOW_MAP_INVOLVED="gpt-6-astra@xhigh"
JEV_SHADOW_MAP_NOVEL="gpt-6-astra@xhigh"
# Below this confidence no pair is suggested (recorded as low-confidence).
JEV_SHADOW_MIN_CONFIDENCE=0.6
# Maximum UTF-8 bytes of brief text sent; longer briefs are cut and flagged truncated.
JEV_SHADOW_MAX_BYTES=12000
# The detached worker gives up observing the Codex run after this many seconds.
JEV_SHADOW_TIMEOUT_SECONDS=5700
# Append-only shadow log; relative paths are under the orchestra state dir.
JEV_SHADOW_LOG="codex-shadow.jsonl"

# --- Local llama.cpp scan second opinion (opt-in, log only; changes no output) ---
# Set to 1 to let orch-jev scan hand its prepared request and Jev's answers to a detached
# bin/orch-jev-local worker that asks a resident local model the same questions and appends the
# probabilities to its own log. Off by default. Nothing leaves the machine.
JEV_LOCAL_ENABLED=0
# Unix socket of the llama-server started by "orch-jev-local serve"; relative paths are under the
# orchestra state dir.
JEV_LOCAL_SOCKET="jev-local/llama.sock"
# Pinned GGUF (Qwen3-8B Q8_0, Qwen/Qwen3-8B-GGUF rev 7c41481f); serve refuses any other SHA-256.
JEV_LOCAL_MODEL_PATH="models/Qwen3-8B-Q8_0.gguf"
JEV_LOCAL_MODEL_DIGEST="408b955510e196121c1c375201744783b5c9a43c7956d73fc78df54c66e883d6"
# llama.cpp server binary (name on PATH or absolute path) and the one GPU index it may use.
JEV_LOCAL_SERVER_BIN="llama-server"
JEV_LOCAL_GPU="0"
# Per-request timeout and whole-worker deadline, in seconds.
JEV_LOCAL_TIMEOUT_SECONDS=10
JEV_LOCAL_DEADLINE_SECONDS=60
# Append-only log; relative paths are under the orchestra state dir.
JEV_LOCAL_LOG="jev-local.jsonl"
