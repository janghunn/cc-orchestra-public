# Runtime budget and routing policy for cc-orchestra.
#
# Unlike model-policy.conf, this file is read on every runtime guard/Codex invocation and is
# intentionally excluded from orch-policy-rev. Editing it changes the next dispatch without
# restarting an existing cc-orch session.

BUDGET_CLAUDE_STALE_MINUTES=30
BUDGET_CODEX_STALE_HOURS=24
BUDGET_CODEX_REFRESH_SECONDS=60
BUDGET_METRICS_MAX_AGE_SECONDS=90
BUDGET_STATUSLINE_REFRESH_SECONDS=60

# headroom ratio = remaining quota fraction / remaining time fraction
# Initial operating policy: deliberately aggressive. We would rather discover the real ceiling
# than finish a reset window with a large unused subscription balance. The hard reserve still
# exists, but conservation now starts substantially later.
BUDGET_WATCH_RATIO=0.55
BUDGET_TIGHT_RATIO=0.30
BUDGET_CRITICAL_RATIO=0.10
BUDGET_NEAR_RESET_MINUTES=10

# Fallback when a reset epoch is unavailable. Stay aggressive even without pacing data.
BUDGET_UNKNOWN_WATCH_PCT=88
BUDGET_UNKNOWN_TIGHT_PCT=96
BUDGET_UNKNOWN_CRITICAL_PCT=99

# Keep Codex as the execution provider through healthy/watch/tight. Provider-level sparing only
# begins at critical pressure; model/effort downgrades still happen inside Codex before then.
BUDGET_PROVIDER_SWITCH_MARGIN=0.35
BUDGET_CODEX_SPARING_MIN_RANK=3
BUDGET_FABLE_RESERVE_PCT=85

# Automatic Codex calls run in Fast mode when the resolved model supports it (Astra/Sol/Terra).
# Explicit Luna/--mech/--fast requests remain intentional compatibility overrides and are not
# rewritten.
CODEX_ALWAYS_FAST_MODE=1

# Claude lead profiles selected at each dispatch boundary.
CLAUDE_ROUTE_NORMAL_HEALTHY_PROFILE="normal"
CLAUDE_ROUTE_NORMAL_WATCH_PROFILE="normal"
CLAUDE_ROUTE_NORMAL_TIGHT_PROFILE="light"
CLAUDE_ROUTE_NORMAL_CRITICAL_PROFILE="light"

CLAUDE_ROUTE_CRITICAL_HEALTHY_PROFILE="critical"
CLAUDE_ROUTE_CRITICAL_WATCH_PROFILE="normal"
CLAUDE_ROUTE_CRITICAL_TIGHT_PROFILE="normal"
CLAUDE_ROUTE_CRITICAL_CRITICAL_PROFILE="normal"

CLAUDE_ROUTE_DEEP_HEALTHY_PROFILE="critical-xhigh"
CLAUDE_ROUTE_DEEP_WATCH_PROFILE="critical"
CLAUDE_ROUTE_DEEP_TIGHT_PROFILE="normal"
CLAUDE_ROUTE_DEEP_CRITICAL_PROFILE="normal"

# Codex models are resolved on every codex-run invocation. Explicit model/effort/critical/fast
# flags always win over this table. The healthy tier is GPT-6 Astra (gpt-6-astra, Fast on).
# codex-run reads per-account/CLI availability from the live/cached catalog; when Astra is absent
# or lacks the requested effort/Fast tier, auto-routed calls fall back to the lane's plain default
# in model-policy.conf with CODEX-RUN: MODEL_FALLBACK. Explicit --model astra exits 6 when absent.
CODEX_AUTO_IMPLEMENT_HEALTHY_MODEL="gpt-6-astra"
CODEX_AUTO_IMPLEMENT_HEALTHY_EFFORT="xhigh"
CODEX_AUTO_IMPLEMENT_WATCH_MODEL="gpt-5.6-sol"
CODEX_AUTO_IMPLEMENT_WATCH_EFFORT="high"
CODEX_AUTO_IMPLEMENT_TIGHT_MODEL="gpt-5.6-terra"
CODEX_AUTO_IMPLEMENT_TIGHT_EFFORT="high"
CODEX_AUTO_IMPLEMENT_CRITICAL_MODEL="gpt-5.6-terra"
CODEX_AUTO_IMPLEMENT_CRITICAL_EFFORT="medium"
CODEX_AUTO_IMPLEMENT_CRITICAL_ALLOW=0

CODEX_AUTO_INVESTIGATE_HEALTHY_MODEL="gpt-6-astra"
CODEX_AUTO_INVESTIGATE_HEALTHY_EFFORT="high"
CODEX_AUTO_INVESTIGATE_WATCH_MODEL="gpt-5.6-terra"
CODEX_AUTO_INVESTIGATE_WATCH_EFFORT="high"
CODEX_AUTO_INVESTIGATE_TIGHT_MODEL="gpt-5.6-terra"
CODEX_AUTO_INVESTIGATE_TIGHT_EFFORT="medium"
CODEX_AUTO_INVESTIGATE_CRITICAL_MODEL="gpt-5.6-terra"
CODEX_AUTO_INVESTIGATE_CRITICAL_EFFORT="low"
CODEX_AUTO_INVESTIGATE_CRITICAL_ALLOW=0

CODEX_AUTO_INTAKE_HEALTHY_MODEL="gpt-6-astra"
CODEX_AUTO_INTAKE_HEALTHY_EFFORT="high"
CODEX_AUTO_INTAKE_WATCH_MODEL="gpt-5.6-terra"
CODEX_AUTO_INTAKE_WATCH_EFFORT="medium"
CODEX_AUTO_INTAKE_TIGHT_MODEL="gpt-5.6-terra"
CODEX_AUTO_INTAKE_TIGHT_EFFORT="medium"
CODEX_AUTO_INTAKE_CRITICAL_MODEL="gpt-5.6-terra"
CODEX_AUTO_INTAKE_CRITICAL_EFFORT="low"

# Review/verify retain a reserve even under pressure. --critical bypasses model auto-routing,
# but the runtime facade still enables Fast mode when its resolved model is Astra/Sol/Terra.
CODEX_AUTO_REVIEW_HEALTHY_MODEL="gpt-6-astra"
CODEX_AUTO_REVIEW_HEALTHY_EFFORT="high"
CODEX_AUTO_REVIEW_WATCH_MODEL="gpt-5.6-sol"
CODEX_AUTO_REVIEW_WATCH_EFFORT="medium"
CODEX_AUTO_REVIEW_TIGHT_MODEL="gpt-5.6-terra"
CODEX_AUTO_REVIEW_TIGHT_EFFORT="high"
CODEX_AUTO_REVIEW_CRITICAL_MODEL="gpt-5.6-terra"
CODEX_AUTO_REVIEW_CRITICAL_EFFORT="medium"

CODEX_AUTO_PLAN_REVIEW_HEALTHY_MODEL="$CODEX_AUTO_REVIEW_HEALTHY_MODEL"
CODEX_AUTO_PLAN_REVIEW_HEALTHY_EFFORT="$CODEX_AUTO_REVIEW_HEALTHY_EFFORT"
CODEX_AUTO_PLAN_REVIEW_WATCH_MODEL="$CODEX_AUTO_REVIEW_WATCH_MODEL"
CODEX_AUTO_PLAN_REVIEW_WATCH_EFFORT="$CODEX_AUTO_REVIEW_WATCH_EFFORT"
CODEX_AUTO_PLAN_REVIEW_TIGHT_MODEL="$CODEX_AUTO_REVIEW_TIGHT_MODEL"
CODEX_AUTO_PLAN_REVIEW_TIGHT_EFFORT="$CODEX_AUTO_REVIEW_TIGHT_EFFORT"
CODEX_AUTO_PLAN_REVIEW_CRITICAL_MODEL="$CODEX_AUTO_REVIEW_CRITICAL_MODEL"
CODEX_AUTO_PLAN_REVIEW_CRITICAL_EFFORT="$CODEX_AUTO_REVIEW_CRITICAL_EFFORT"

CODEX_AUTO_VERIFY_HEALTHY_MODEL="gpt-6-astra"
CODEX_AUTO_VERIFY_HEALTHY_EFFORT="high"
CODEX_AUTO_VERIFY_WATCH_MODEL="gpt-5.6-terra"
CODEX_AUTO_VERIFY_WATCH_EFFORT="medium"
CODEX_AUTO_VERIFY_TIGHT_MODEL="gpt-5.6-terra"
CODEX_AUTO_VERIFY_TIGHT_EFFORT="medium"
CODEX_AUTO_VERIFY_CRITICAL_MODEL="gpt-5.6-terra"
CODEX_AUTO_VERIFY_CRITICAL_EFFORT="low"
