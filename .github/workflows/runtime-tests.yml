name: cc-orchestra runtime tests

on:
  push:
    branches: [main, feat/ops-session-layer]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer syntax and help
        run: bash -n install.sh && bash install.sh --help >/dev/null
      - name: Existing policy suite
        run: bash tests/test-policy.sh
      - name: Reload registry guard suite
        run: bash tests/test-reload.sh
      - name: Runtime routing and session suite
        run: bash tests/test-runtime.sh
      - name: Poll guard hook suite
        run: bash tests/test-poll-guard.sh
      - name: Verifier Bash guard hook suite
        run: bash tests/test-verifier-bash-guard.sh
      - name: Tier-1 runtime regression suite
        run: bash tests/test-tier1-runtime.sh
      - name: Runtime policy notice suite
        run: bash tests/test-notice-runtime.sh
      - name: Install manifest and doctor suite
        run: bash tests/test-orch-doctor.sh
      - name: Worktree collision guard suite
        run: bash tests/test-worktree-guard.sh
      - name: Lead stop gate suite
        run: bash tests/test-stop-gate.sh
      - name: Safety hook wiring suite
        run: bash tests/test-hook-wiring.sh
      - name: Advisory security scan suite
        run: bash tests/test-security-scan.sh
      - name: Archive vault and raw store suite
        run: bash tests/test-archive.sh
      - name: Jev advisory sidecar suite
        run: bash tests/test-jev.sh
      - name: Jev Codex-routing shadow suite
        run: bash tests/test-jev-shadow.sh
      - name: Jev local second-opinion suite
        run: bash tests/test-jev-local.sh
      - name: Codex-only orchestration and backend switching
        run: bash tests/test-codex-only.sh
      - name: Accepted-status gate suite
        run: bash tests/test-accepted-status.sh
      - name: Compact-context hook suite
        run: bash tests/test-compact-context.sh
      - name: Compaction replay suite
        run: bash tests/test-compaction-replay.sh
      - name: Diff triage suite
        run: bash tests/test-diff-triage.sh
      - name: Jev eval suite
        run: bash tests/test-jev-eval.sh
      - name: Jev stage-1 shadow analysis suite
        run: bash tests/test-jev-stage1.sh
      - name: Mods observer suite
        run: bash tests/test-mods-observer.sh
      # Not run here (fail in a runner-like simulation, see task 75):
      # - tests/test-orch-gc.sh: needs Python 3.13 (mmap trackfd=), ubuntu-latest ships 3.12.
      # - tests/test-install-dry-run.sh: fails under a clean env/fresh HOME ("unplanned .../home/.cache"); passes only un-sandboxed on the host.
