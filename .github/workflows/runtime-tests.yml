name: cc-orchestra runtime tests

on:
  push:
    branches: [main, feat/ops-session-layer]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer syntax and help
        run: bash -n install.sh && bash install.sh --help >/dev/null
      - name: Existing policy suite
        run: bash tests/test-policy.sh
      - name: Runtime routing and session suite
        run: bash tests/test-runtime.sh
      - name: Poll guard hook suite
        run: bash tests/test-poll-guard.sh
      - name: Verifier Bash guard hook suite
        run: bash tests/test-verifier-bash-guard.sh
      - name: Tier-1 runtime regression suite
        run: bash tests/test-tier1-runtime.sh
      - name: Runtime policy notice suite
        run: bash tests/test-notice-runtime.sh
      - name: Install manifest and doctor suite
        run: bash tests/test-orch-doctor.sh
      - name: Worktree collision guard suite
        run: bash tests/test-worktree-guard.sh
      - name: Lead stop gate suite
        run: bash tests/test-stop-gate.sh
      - name: Safety hook wiring suite
        run: bash tests/test-hook-wiring.sh
